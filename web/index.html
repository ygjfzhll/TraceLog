<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>TraceLog</title>

<style>
:root { --ink:#1c2430; --muted:#64748b; --line:#e8edf3; --bg:#f4f7fb; --accent:#2563eb; --side:#0b1220; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.5 "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
button, input, select, textarea { font:inherit; }
.shell { display:grid; grid-template-columns:208px 1fr; min-height:100vh; }
aside { background:var(--side); color:#e5e7eb; padding:16px 12px; display:flex; flex-direction:column; height:100vh; position:sticky; top:0; }
.brand { padding:4px 8px 16px; font-weight:650; }
.nav button { width:100%; text-align:left; background:transparent; color:#d1d5db; border:0; border-radius:8px; padding:9px 10px; cursor:pointer; }
.nav button.active { background:#1f2937; color:#fff; }
.side-foot { margin-top:auto; display:flex; gap:8px; align-items:center; }
.avatar { width:28px; height:28px; border-radius:50%; background:var(--accent); display:grid; place-items:center; }
#logout { background:transparent; border:0; color:#94a3b8; cursor:pointer; }
main { padding:24px 28px 40px; }
.page { display:none; } .page.show { display:block; }
.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
h1 { font-size:18px; margin:0; }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
.grid { display:grid; grid-template-columns:320px 1fr; gap:14px; }
#traceWork[hidden], .modal[hidden] { display:none !important; }
label { display:block; color:var(--muted); font-size:12px; margin:10px 0 4px; }
input, select, textarea { width:100%; padding:8px 10px; border:1px solid #d5d9e2; border-radius:8px; }
button.primary { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; }
button.ghost { background:#eef2ff; color:#24356b; border:0; border-radius:8px; padding:7px 10px; cursor:pointer; }
.actions { display:flex; gap:8px; align-items:center; margin-top:12px; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #f1f5f9; vertical-align:top; }
th { color:var(--muted); font-size:12px; }
.meta { color:var(--muted); font-size:12px; }
.slow { color:#d92d20; font-weight:600; }
.login { max-width:360px; margin:12vh auto; }
body.authed #login { display:none; }
body:not(.authed) .shell { display:none; }
.row { padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
.row.active, .row:hover { background:#f8fafc; }
.filters { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.filters input { width:140px; }
.brief pre, .step .raw { white-space:pre-wrap; background:#f8fafc; border-radius:8px; padding:10px 12px; }
.step .raw { display:none; max-height:220px; overflow:auto; }
.step.open .raw { display:block; }
.step { display:grid; grid-template-columns:72px 1fr; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.step.bad { color:#d92d20; }
.fields { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
.span-2 { grid-column:1 / -1; }
.checks { display:flex; flex-wrap:wrap; gap:8px; }
.checks label { margin:0; color:var(--ink); background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
#hostBox[hidden] { display:none !important; }
#hostChecks { flex-direction:column; align-items:stretch; max-height:240px; overflow:auto; }
#hostChecks label { justify-content:flex-start; gap:8px; }
.modal { position:fixed; inset:0; background:rgba(16,24,40,.45); display:flex; justify-content:center; padding:8vh 16px; }
.sheet { width:min(560px,100%); background:#fff; border-radius:14px; padding:18px; max-height:80vh; overflow:auto; }
.home-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.home-grid.single { grid-template-columns:1fr; }
.home-search { display:flex; align-items:center; gap:8px; }
.home-search select, .home-search input { width:auto; height:36px; margin:0; }
.home-search .project { width:180px; }
.home-search .kind { width:132px; }
.home-search input { flex:1; min-width:160px; }
.home-search button { height:36px; white-space:nowrap; }
#homeAttention tr { cursor:pointer; }
#homeAttention td.uri { max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#homeReportCard[hidden] { display:none !important; }
#statsTable td.uri { max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#175cd3; }
h2 { font-size:15px; margin:0 0 12px; font-weight:650; }
.home-link { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
.home-project { display:flex; align-items:baseline; justify-content:flex-start; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); }
.home-link:last-child, .home-project:last-child { border-bottom:0; padding-bottom:0; }
#statList[hidden] { display:none !important; }
.home-link button { padding:4px 10px; }
.home-project span { color:var(--muted); font-size:12px; }
.stat-line { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
.stat-line:last-child { border-bottom:0; padding-bottom:0; }
.stat-line input, .stat-line select { width:auto; padding:6px 8px; }
.stat-line .name { width:128px; }
.stat-line .project { width:150px; }
.stat-line .window { width:132px; }
.stat-line .container { width:168px; }
.stat-line .time { width:188px; }
.stat-line input[hidden] { display:none !important; }
.stat-line label { margin:0; display:flex; align-items:center; gap:4px; color:var(--ink); font-size:13px; }
.stat-line input[type=checkbox] { width:auto; }
.stat-line button { padding:6px 10px; }
.stat-line button:disabled { opacity:.45; cursor:default; }
.stat-line.active { background:#f8fafc; border-radius:8px; }
#statResult[hidden] { display:none !important; }



.bars { display:flex; flex-direction:column; gap:8px; }
.bar-row { display:grid; grid-template-columns:minmax(80px,180px) 1fr 72px; gap:8px; align-items:center; }
.bar-row span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-track { background:#eef2ff; border-radius:99px; height:8px; }
.bar-fill { background:#2563eb; height:8px; border-radius:99px; }
.report-line { width:100%; height:220px; }
.report-line polyline { fill:none; stroke:#2563eb; stroke-width:2; }
.report-labels { display:flex; gap:8px; overflow:hidden; color:var(--muted); font-size:12px; }
.report-labels span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#reportChart[hidden] { display:none !important; }
.report-axes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px 16px; align-items:end; }
.report-axes label { margin-top:0; }
.report-axes select { min-height:38px; background:#fff; }

#linkList td { vertical-align:middle; }
#linkList .row-actions { white-space:nowrap; text-align:right; }
#linkList .row-actions button { background:#fff; color:#334155; border:1px solid #e2e8f0; border-radius:6px; padding:3px 8px; margin-left:6px; cursor:pointer; font-size:12px; }
#linkList .row-actions button:hover { background:#f8fafc; }
#linkList .row-actions button.danger { color:#b42318; border-color:#fecdca; }
#statsEditor[hidden] { display:none !important; }
#feishuCard { display:none !important; }

#page-stats > .top button.primary { height:34px; padding:0 14px; border-radius:8px; font-size:13px; }
#projectStatList { padding:12px 18px; }
.stat-project { display:flex; align-items:center; justify-content:space-between; width:100%; gap:16px; min-height:36px; padding:0; border-bottom:1px solid var(--line); }
.stat-project:last-child { border-bottom:0; }
.stat-project .lead, .stat-project .tools { display:contents; }
.stat-project .pname { font-weight:650; font-size:14px; line-height:36px; white-space:nowrap; margin:0; }
.stat-project select, .stat-project input.time { width:auto; height:36px; margin:0; padding:0 12px; border:1px solid #e6ebf2; border-radius:8px; background:#f8fafc; color:var(--ink); }
.stat-project select.window { width:132px; }
.stat-project select.container { width:168px; }
.stat-project input.time { width:178px; }
.stat-project input.time[hidden] { display:none !important; }
.stat-project select:hover, .stat-project input.time:hover { background:#fff; border-color:#cbd5e1; }
.stat-project select:focus, .stat-project input.time:focus { outline:none; background:#fff; border-color:#93c5fd; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
.stat-project label.realtime { height:36px; margin:0; padding:0 10px; display:inline-flex; align-items:center; gap:6px; border:1px solid #e6ebf2; border-radius:8px; background:#f8fafc; color:#334155; font-size:13px; white-space:nowrap; }
.stat-project label.realtime input { width:auto; margin:0; }
.stat-project label.realtime:has(input:checked) { background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8; }
#projectStatList .row-actions { display:inline-flex; align-items:center; gap:6px; }
#projectStatList .row-actions button { height:36px; margin:0; padding:0 12px; background:#fff; color:#334155; border:1px solid #e6ebf2; border-radius:8px; cursor:pointer; font-size:13px; }
#projectStatList .row-actions button.go { background:var(--accent); border-color:var(--accent); color:#fff; }
#projectStatList .row-actions button:hover { background:#f8fafc; }
#projectStatList .row-actions button.go:hover { background:#1d4ed8; }
#reportList .row-actions { white-space:nowrap; text-align:right; }
#reportList .row-actions button { background:#fff; color:#334155; border:1px solid #e2e8f0; border-radius:6px; padding:3px 8px; margin-left:6px; cursor:pointer; font-size:12px; }
#reportList .row-actions button:hover { background:#f8fafc; }
#reportList .row-actions button.danger { color:#b42318; border-color:#fecdca; }
#reportForm[hidden], #reportChart[hidden], #reportTableCard[hidden] { display:none !important; }
#dataSourceForm[hidden] { display:none !important; }
#dataSourceTable .row-actions { white-space:nowrap; text-align:right; }
#dataSourceTable .row-actions button { background:#fff; color:#334155; border:1px solid #e2e8f0; border-radius:6px; padding:3px 8px; margin-left:6px; cursor:pointer; font-size:12px; }
#dataSourceTable .row-actions button:hover { background:#f8fafc; }
#dataSourceTable .row-actions button.danger { color:#b42318; border-color:#fecdca; }
#reportData th select { width:auto; min-width:128px; height:28px; margin:6px 0 0; padding:0 8px; font-size:12px; background:#fff; }
#reportData th { vertical-align:bottom; }
</style>
</head>
<body>
<div id="login" class="card login"><h1>TraceLog</h1>
<form id="loginForm"><label>用户名</label><input name="username" required /><label>密码</label><input name="password" type="password" required /><button class="primary" type="submit">登录</button><button class="ghost" id="anonymousLogin" type="button" style="margin-top:8px">匿名登录</button><p class="meta" id="loginStatus"></p></form></div>
<div class="shell"><aside><div class="brand">TraceLog</div><nav class="nav">
<button type="button" data-page="home" class="active">首页</button>
<button type="button" data-page="trace">日志链路追踪</button>
<button type="button" data-page="stats">接口统计</button>
<button type="button" data-page="reports" data-report="1">日志报表</button>
<button type="button" data-page="datasources" data-data="1">数据接入</button>
<button type="button" data-page="projects">项目管理</button>
<button type="button" data-page="sources" data-admin="1">日志接入</button>
<button type="button" data-page="fields" data-admin="1">查询条件</button>
<button type="button" data-page="users" data-admin="1">用户管理</button>
</nav><div class="side-foot"><span class="avatar" id="avatar">A</span><span id="who"></span><button id="logout" type="button">退出</button></div></aside>
<main>

<section class="page show" id="page-home"><div class="top"><h1>首页</h1></div>
<form class="card home-search" id="homeSearch"><select id="homeProject" class="project"></select><select id="homeKind" class="kind"><option value="trace_id">Trace ID</option><option value="log_id">日志 ID</option><option value="user_id">用户 ID</option></select><input id="homeKeyword" placeholder="输入后直接查看链路" /><button class="primary" type="submit">查询</button></form>
<p class="meta" id="homeSearchStatus"></p>
<section class="card" style="margin-top:14px"><h2>最近 1 小时报错最多的接口</h2><div id="homeAttention">正在加载…</div></section>
<section class="card" id="homeReportCard" style="margin-top:14px"><h2>已保存的报表</h2><div id="homeReports">正在加载…</div></section></section>
<section class="page" id="page-trace"><div class="top"><h1>日志链路追踪</h1><button class="primary" id="newLink" type="button">新建链路</button></div>
<div class="card" id="linkList" style="margin-bottom:14px"></div>
<div class="grid" id="traceWork" hidden>
<form class="card" id="searchForm">
<input type="hidden" id="linkId" /><input type="hidden" name="namespace" id="searchNamespace" /><input type="hidden" name="container" id="searchContainer" /><input type="hidden" name="allContainers" id="searchAllContainers" /><input type="hidden" name="drillText" id="drillText" />
<label>链路名称</label><input id="linkName" />
<label>项目</label><select name="projectId" id="projectSelect" required></select>
<div id="conditionList"></div>
<button class="ghost" id="addCondition" type="button">添加条件</button>
<label>时间范围</label><select name="window" id="searchWindow"><option value="5m">最近 5 分钟</option><option value="15m">最近 15 分钟</option><option value="1h" selected>最近 1 小时</option><option value="6h">最近 6 小时</option><option value="custom">自定义</option></select>
<div id="customTime" hidden><label>开始</label><input name="timeFrom" type="datetime-local" /><label>结束</label><input name="timeTo" type="datetime-local" /></div>
<div class="actions"><button class="primary" type="submit">查看</button><button class="ghost" id="saveLink" type="button">保存</button></div>
<p class="meta" id="searchStatus"></p></form>
<div class="card"><div class="filters"><input id="filterUri" placeholder="接口" /><input id="filterService" placeholder="服务" /><label style="margin:0"><input id="filterFail" type="checkbox" style="width:auto" /> 只看失败</label><button class="ghost" id="exportTrace" type="button">导出文本</button></div>
<div style="display:grid;grid-template-columns:280px 1fr;gap:12px"><div id="requestList" class="meta">查看一条链路后，这里列出请求。</div><div id="eventList"></div></div></div></div></section>
<section class="page" id="page-stats"><div class="top"><h1>接口请求统计</h1><button class="primary" id="newStat" type="button">新增接口请求统计</button></div>
<div class="card" id="projectStatList"></div>
<div class="card" id="statsEditor" hidden><div class="top"><h2 id="statsEditTitle">编辑</h2><button class="ghost" id="statsEditClose" type="button">收起</button></div>
<form class="card" id="statsForm"><div class="fields"><div><label>项目</label><select name="projectId" id="statsProject" required></select></div>
<div><label>时间范围</label><select name="window" id="statsWindow"><option value="15m" selected>最近 15 分钟</option><option value="1h">最近 1 小时</option><option value="6h">最近 6 小时</option><option value="custom">自定义</option></select></div>
<div id="statsCustom" class="span-2" hidden><label>开始</label><input name="timeFrom" type="datetime-local" /><label>结束</label><input name="timeTo" type="datetime-local" /></div></div>
<div class="actions"><button class="primary" type="submit">统计</button><label style="margin:0"><input name="realtime" value="1" type="checkbox" style="width:auto" /> 实时</label><select id="statsContainer" name="container" style="width:220px"><option value="">全部容器</option></select><button class="ghost" id="exportStats" type="button">导出</button></div></form>
<section class="card" id="feishuCard" data-admin="1" style="margin-top:14px">
<div class="fields"><div class="span-2"><label>飞书机器人地址</label><input id="feishuWebhook" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/..." /></div>
<div><label>每天发送</label><input id="feishuTime" type="time" value="09:00" /></div>
<div><label style="margin-top:28px"><input id="feishuEnabled" type="checkbox" style="width:auto" /> 开启</label></div></div>
<div class="actions"><button class="primary" id="feishuSave" type="button">保存</button><button class="ghost" id="feishuSend" type="button">立即发送</button></div>
<p class="meta" id="feishuStatus"></p></section></div>
<div class="card" id="statList" hidden></div>
<div class="card" id="statResult" style="margin-top:14px;overflow:auto" hidden><h2 id="statResultTitle">统计结果</h2><p class="meta" id="statsStatus"></p><table id="statsTable"></table></div>
</section>
<section class="page" id="page-projects"><div class="top"><h1>项目管理</h1><button class="primary" id="newProject" type="button">新建项目</button></div>
<div class="card"><table id="projectTable"></table></div>
<form class="modal" id="projectForm" hidden><div class="sheet"><div class="fields">
<div><label>项目名称</label><input name="name" required /></div>
<div class="span-2"><label>日志地址</label><div class="checks" id="sourceChecks"></div></div>
<div><label>运行方式</label><select name="deployMode" id="deployMode"><option value="kubernetes">Kubernetes</option><option value="host">主机</option></select></div>
<div class="span-2" id="scopeBox"><label id="scopeLabel">命名空间（可多个）</label><textarea name="namespace" id="namespaceInput" rows="3"></textarea><div id="hostBox" hidden><div class="checks" id="hostChecks"></div><p class="meta" id="hostStatus"></p></div></div>
<div><label>说明</label><input name="remark" /></div>
<div><label>慢接口阈值（毫秒）</label><input name="slowMs" type="number" value="500" /></div>
</div><input type="hidden" name="id" id="projectId" /><input type="hidden" name="containers" id="containerValue" />
<div class="actions"><button class="primary" id="projectSubmit" type="submit">添加项目</button><button class="ghost" id="projectCancel" type="button">取消</button></div>
<p class="meta" id="projectStatus"></p></div></form></section>
<section class="page" id="page-sources"><div class="top"><h1>日志接入</h1></div>
<form class="card" id="sourceForm"><div class="fields">
<div><label>名称</label><input name="name" required /></div><div><label>地址</label><input name="baseUrl" required /></div>
<div><label>Account ID</label><input name="accountId" value="1" /></div><div><label>Project ID</label><input name="projectId" value="1" /></div>
</div><button class="primary" type="submit">添加</button><p class="meta" id="sourceStatus"></p></form>
<div class="card" style="margin-top:14px"><table id="sourceTable"></table></div></section>
<section class="page" id="page-fields"><div class="top"><h1>查询条件</h1></div>
<form class="card" id="fieldForm"><div class="fields">
<div><label>名称</label><input name="name" required /></div>
<div><label>匹配方式</label><select name="kind" id="fieldKind"><option value="user_id">用户 ID</option><option value="trace_id">Trace ID</option><option value="log_id">日志 ID</option><option value="contains">日志包含</option><option value="template">自定义模板</option></select></div>
<div class="span-2" id="patternBox" hidden><label>模板，用 {value}</label><textarea name="pattern" rows="3"></textarea></div>
</div><input type="hidden" name="id" id="fieldId" /><button class="primary" type="submit">添加条件</button><p class="meta" id="fieldStatus"></p></form>
<div class="card" style="margin-top:14px"><table id="fieldTable"></table></div></section>
<section class="page" id="page-users"><div class="top"><h1>用户管理</h1><button class="primary" id="openUser" type="button">添加用户</button><button class="ghost" id="openPassword" type="button">修改我的密码</button></div>
<div class="card"><table id="userTable"></table></div>
<form class="modal" id="userForm" hidden><div class="sheet"><h2 id="userFormTitle">添加用户</h2>
<label>用户名</label><input name="username" id="userName" required />
<div id="userPasswordBox"><label>密码</label><input name="password" type="password" /></div>
<label><input type="checkbox" id="canCreateProject" name="canCreateProject" value="1" style="width:auto" /> 允许新建项目</label>
<label><input type="checkbox" id="canDataSource" name="canDataSource" value="1" style="width:auto" /> 允许数据接入</label>
<label><input type="checkbox" id="canReport" name="canReport" value="1" style="width:auto" /> 允许日志报表</label>
<label>可查看的项目</label><div id="grantProjects" class="checks"></div>
<label>可查看的数据源</label><div id="grantSources" class="checks"></div><input type="hidden" id="userEditing" />
<div class="actions"><button class="primary" type="submit">保存</button><button class="ghost" type="button" data-close="userForm">取消</button></div>
<p class="meta" id="userStatus"></p></div></form>
<form class="modal" id="passwordForm" hidden><div class="sheet">
<label>当前密码</label><input name="oldPassword" type="password" required /><label>新密码</label><input name="newPassword" type="password" required />
<div class="actions"><button class="primary" type="submit">保存</button><button class="ghost" type="button" data-close="passwordForm">取消</button></div>
<p class="meta" id="passwordStatus"></p></div></form></section>

<section class="page" id="page-datasources"><div class="top"><h1>数据接入</h1><button class="primary" id="dataSourceNew" type="button">新建数据接入</button></div>
<div class="card"><table id="dataSourceTable"></table></div>
<form class="card" id="dataSourceForm" hidden style="margin-top:14px"><div class="top"><h2 id="dataSourceTitle">新建数据接入</h2><button class="ghost" id="dataSourceClose" type="button">收起</button></div><input type="hidden" id="dataSourceId" />
<div class="fields">
<div><label>名称</label><input name="name" required /></div>
<div><label>主机</label><input name="host" placeholder="127.0.0.1" required /></div>
<div><label>端口</label><input name="port" value="3306" required /></div>
<div><label>用户名</label><input name="username" required /></div>
<div><label>密码</label><input name="password" id="dataSourcePassword" type="password" placeholder="已保存的密码不会再显示，不修改请留空" /></div>
<div><label>数据库</label><input name="database" required /></div>
</div>
<div class="actions"><button class="primary" id="dataSourceSubmit" type="submit">保存</button><button class="ghost" id="dataSourceTest" type="button">测试连接</button></div>
</form>
<p class="meta" id="dataSourceStatus"></p></section>

let savedReports = [];
let reportHoldSql = false;
function reportKindText(kind) { return {bar:"柱状图", line:"折线图", table:"表格"}[kind] || "柱状图"; }
function reportOptions(select, values, selected) {
  select.innerHTML = "<option value=''>自动</option>" + values.map((name) => `<option value="${esc(name)}"${name === selected ? " selected" : ""}>${esc(name)}</option>`).join("");

async function loadSavedReports() {

  box.querySelectorAll("button").forEach((button) => { button.onclick = () => actSavedReport(button.dataset.id, button.dataset.act); });

function savedReport(id) { return savedReports.find((item) => String(item.id) === String(id)); }
async function loadReportTables() {
  const sourceId = $("reportSource").value;
  $("reportTable").innerHTML = "<option value=''>请选择</option>";
  if (!sourceId) { reportOptions($("reportX"), [], ""); reportOptions($("reportY"), [], ""); return; }
  if (!reportHoldSql) { reportOptions($("reportX"), [], ""); reportOptions($("reportY"), [], ""); }
  $("reportStatus").textContent = "正在读取数据表…";
  try {
    const body = await api("/api/reports/tables", { method:"POST", body: new URLSearchParams({sourceId}) });
    $("reportTable").innerHTML = "<option value=''>请选择</option>" + (body.tables || []).map((name) => `<option value="${esc(name)}">${esc(name)}</option>`).join("");
    $("reportStatus").textContent = "";
  } catch (error) { $("reportStatus").textContent = error.message; }
}
async function loadReportColumns() {
  const sourceId = $("reportSource").value;
  const table = $("reportTable").value;
  if (!sourceId || !table) return;
  if (!reportHoldSql) $("reportSql").value = "SELECT * FROM `" + table + "` LIMIT 100";
  try {
    const body = await api("/api/reports/columns", { method:"POST", body: new URLSearchParams({sourceId, table}) });
    const names = body.columns || [];
    const x = reportHoldSql ? $("reportX").value : (names[0] || "");
    const y = reportHoldSql ? $("reportY").value : (names[1] || "");
    reportOptions($("reportX"), names, x);
    reportOptions($("reportY"), names, y);
  } catch (error) { $("reportStatus").textContent = error.message; }
}
function reportPoints(columns, rows, xName, yName) {
  const x = xName || columns[0] || "";
  const y = yName || columns.find((name) => name !== x && rows.some((row) => Number.isFinite(Number(row[name])))) || "";
  const grouped = new Map();
  rows.forEach((row) => {
    const label = String(row[x] ?? "");
    const numeric = y && Number.isFinite(Number(row[y]));
    const value = numeric ? Number(row[y]) : 1;
    grouped.set(label, (grouped.get(label) || 0) + value);
  });
  return [...grouped.entries()].map(([label, value]) => ({label, value})).sort((a, b) => b.value - a.value);
}
function drawReport(kind, points) {
  const box = $("reportChart");
  if (kind === "table" || !points.length) { box.innerHTML = ""; box.hidden = true; return; }
  box.hidden = false;
  const max = Math.max(...points.map((item) => item.value), 1);
  if (kind === "line") {
    const width = 640, height = 220, pad = 24;
    const step = points.length > 1 ? (width - pad * 2) / (points.length - 1) : 0;
    const coords = points.map((item, index) => {
      const x = pad + step * index;
      const y = height - pad - (item.value / max) * (height - pad * 2);
      return [x, y];
    });
    const line = coords.map((item) => item.join(",")).join(" ");
    box.innerHTML = `<svg viewBox="0 0 ${width} ${height}" class="report-line"><polyline points="${line}" /></svg><div class="report-labels">${points.map((item) => `<span title="${esc(item.label)}">${esc(item.label)}</span>`).join("")}</div>`;
    return;
  }
  box.innerHTML = `<div class="bars">${points.map((item) => `<div class="bar-row"><span title="${esc(item.label)}">${esc(item.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, item.value / max * 100)}%"></div></div><b>${esc(item.value)}</b></div>`).join("")}</div>`;
}
let reportResultColumns = [], reportResultRows = [], reportResultKind = "table", reportResultX = "", reportResultY = "", reportFilters = {};
function isReasonColumn(name) { return /reason|原因/i.test(name); }
function isDateColumn(name, rows) {
  if (/date|日期/i.test(name)) return true;
  const sample = rows.slice(0, 30).map((row) => String(row[name] ?? "")).filter(Boolean);
  return sample.length > 0 && sample.every((value) => /^\d{4}-\d{2}-\d{2}/.test(value));
}
function uniqueColumnValues(rows, name) {
  const values = [...new Set(rows.map((row) => String(row[name] ?? "")).filter((value) => value !== ""))];
  return isDateColumn(name, rows) ? values.sort((a, b) => b.localeCompare(a)) : values.sort((a, b) => a.localeCompare(b, "zh"));
}
function filteredReportRows() {
  return reportResultRows.filter((row) => Object.entries(reportFilters).every(([name, value]) => !value || String(row[name] ?? "") === value));
}
function renderReportTable() {
  const columns = reportResultColumns;
  const shown = filteredReportRows();
  const head = "<tr>" + columns.map((name) => {
    const filterable = isReasonColumn(name) || isDateColumn(name, reportResultRows);
    if (!filterable) return `<th>${esc(name)}</th>`;
    const options = uniqueColumnValues(reportResultRows, name).map((value) => `<option value="${esc(value)}"${reportFilters[name] === value ? " selected" : ""}>${esc(value)}</option>`).join("");
    const label = isReasonColumn(name) ? "全部原因" : "全部日期";
    return `<th><div>${esc(name)}</div><select data-col="${esc(name)}"><option value="">${label}</option>${options}</select></th>`;
  }).join("") + "</tr>";
  const body = shown.map((row) => "<tr>" + columns.map((name) => `<td>${esc(row[name] ?? "")}</td>`).join("") + "</tr>").join("");
  $("reportData").innerHTML = columns.length ? head + body : "";
  $("reportData").querySelectorAll("select").forEach((select) => {
    select.onchange = () => {
      reportFilters[select.dataset.col] = select.value;
      const next = filteredReportRows();
      drawReport(reportResultKind, reportPoints(columns, next, reportResultX, reportResultY));
      renderReportTable();
      $("reportStatus").textContent = "共 " + next.length + " 行";
    };
  });
  return shown;
}
function showReportResult(result, kind, xName, yName) {
  const columns = result.columns || [];
  reportResultColumns = columns;
  reportResultRows = result.rows || [];
  reportResultKind = kind;
  reportResultX = xName || $("reportX").value;
  reportResultY = yName || $("reportY").value;
  reportFilters = {};
  if (!$("reportX").options.length) reportOptions($("reportX"), columns, reportResultX || columns[0] || "");
  if (!$("reportY").options.length) reportOptions($("reportY"), columns, reportResultY || "");
  const shown = renderReportTable();
  drawReport(kind, reportPoints(columns, shown, reportResultX, reportResultY));
  $("reportTableCard").hidden = !columns.length;
  $("reportStatus").textContent = "共 " + shown.length + " 行";
}

async function openReportEditor(item) {
  await loadDataSources("report");
  $("reportForm").hidden = false;
  $("reportId").value = item ? item.id : "";
  $("reportEditTitle").textContent = item ? "编辑报表" : "新建报表";

  $("reportKind").value = item ? (item.chart_kind || "bar") : "bar";
  $("reportSource").value = item ? String(item.source_id) : "";

    await loadReportColumns();

      if (item.axis_y) $("reportY").value = item.axis_y;

async function actSavedReport(id, act) {

  try { await runReportQuery(item.source_id, item.sql_text, item.chart_kind || "bar", item.axis_x || "", item.axis_y || ""); }

}

let projectStatSettings = {};

function renderProjectStatRows() {
  const box = $("projectStatList");
  if (!box) return;

  }).join("");

  box.querySelectorAll(".window").forEach((select) => { select.onchange = () => { const line = select.closest(".stat-project"); const custom = select.value === "custom"; line.querySelector(".from").hidden = !custom; line.querySelector(".to").hidden = !custom; }; });
  fillRowContainers();

async function fillRowContainers() {
  const box = $("projectStatList");
  if (!box) return;
  for (const line of box.querySelectorAll(".stat-project")) {
    const selected = (projectStatSettings[line.dataset.id] || {}).container_name || line.querySelector(".container").value || "";
    try {
      const result = await api("/api/stats/containers", { method:"POST", body: new URLSearchParams({projectId: line.dataset.id}) });
      const select = line.querySelector(".container");
      if (!select) continue;
      select.innerHTML = "<option value=''>全部容器</option>" + (result.containers || []).map((item) => `<option value="${esc(item.name)}"${item.name === selected ? " selected" : ""}>${esc(item.name)}</option>`).join("");
    } catch (error) {}

function projectStatData(id) {

  const line = document.querySelector(`.stat-project[data-id="${id}"]`);
